<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hyrox — Carnet de route</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --surface:#1D2026;
    --surface-2:#252932;
    --text:#F3F0E8;
    --text-dim:#9AA0AC;
    --text-faint:#5C616D;
    --accent:#FF5A36;
    --accent-soft: rgba(255,90,54,0.14);
    --accent2:#2FBFA8;
    --accent2-soft: rgba(47,191,168,0.14);
    --amber:#F2B33D;
    --amber-soft: rgba(242,179,61,0.14);
    --border:#2B2F38;
    --success:#3ED98B;
    --radius:20px;
    --radius-sm:12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none;}
  body{ min-height:100vh; }
  .display{ font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; background:
    radial-gradient(1200px 400px at 50% -10%, rgba(255,90,54,0.08), transparent 60%), var(--bg); }

  /* ---------- HEADER ---------- */
  header{ position:sticky; top:0; z-index:20; padding:calc(10px + var(--safe-top)) 16px 10px; background:rgba(20,22,26,0.88); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .brand{ display:flex; flex-direction:column; line-height:1; }
  .brand .eyebrow{ font-size:10px; letter-spacing:0.18em; color:var(--text-faint); text-transform:uppercase; font-weight:700; }
  .brand .title{ font-size:15px; font-weight:800; color:var(--text); margin-top:2px; }
  .bib{ position:relative; background:var(--surface-2); border:1.5px dashed #3A3F4A; border-radius:10px; padding:6px 14px 5px; text-align:center; min-width:74px; }
  .bib::before, .bib::after{ content:""; position:absolute; top:-4px; width:7px; height:7px; border-radius:50%; background:#0F1013; border:1.5px solid #3A3F4A; }
  .bib::before{ left:8px; } .bib::after{ right:8px; }
  .bib .num{ font-family:'Bebas Neue', sans-serif; font-size:22px; color:var(--accent); line-height:1; }
  .bib .lbl{ font-size:8px; letter-spacing:0.1em; color:var(--text-faint); text-transform:uppercase; font-weight:700; }

  .tabs{ display:flex; gap:6px; background:var(--surface); border-radius:12px; padding:4px; }
  .tab-btn{ flex:1; border:none; background:transparent; color:var(--text-dim); font-family:inherit; font-weight:700; font-size:12.5px; padding:8px 6px; border-radius:9px; cursor:pointer; transition:all .15s ease; }
  .tab-btn.active{ background:var(--accent); color:#1A0D08; }
  .reset-btn{ border:none; background:var(--surface); color:var(--text-faint); width:32px; height:32px; border-radius:10px; font-size:15px; cursor:pointer; margin-left:6px; flex:0 0 auto; }

  .progress-track{ height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin-top:10px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .4s ease; }

  /* ---------- DAY NAV ---------- */
  .day-nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px; }
  .day-nav button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; cursor:pointer; }
  .day-nav button:disabled{ opacity:0.25; }
  .day-info{ text-align:center; }
  .day-info .jour{ font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.02em; }
  .day-info .date{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:-2px;}
  .chips-row{ display:flex; gap:6px; justify-content:center; margin-top:8px; flex-wrap:wrap; padding:0 16px; }
  .tag{ font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px; letter-spacing:0.03em; }
  .tag.phase-Base{ background:var(--accent2-soft); color:var(--accent2); }
  .tag.phase-Build{ background:var(--amber-soft); color:var(--amber); }
  .tag.phase-Peak{ background:var(--accent-soft); color:var(--accent); }
  .tag.phase-Course{ background:#EDEFFF22; color:#B9C0FF; }
  .tag.phase-JOURJ{ background:var(--accent); color:#1A0D08; }
  .tag.effort{ background:var(--surface-2); color:var(--text-dim); }
  .tag.seance{ background:var(--surface-2); color:var(--text); font-weight:700; max-width:100%; white-space:normal; text-align:center; }

  .goto-today{ display:block; margin:8px auto 0; background:none; border:1px solid var(--accent); color:var(--accent); font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px; cursor:pointer; }

  /* ---------- MEAL DOTS ---------- */
  .dots{ display:flex; gap:8px; justify-content:center; padding:14px 16px 4px; }
  .dot{ flex:1; max-width:80px; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; padding:4px; }
  .dot .circle{ width:34px; height:34px; border-radius:50%; background:var(--surface); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-faint); transition: all .2s ease; }
  .dot.current .circle{ border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .dot.done .circle{ background:var(--success); border-color:var(--success); color:#0B1F13; }
  .dot .lbl{ font-size:9.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .dot.current .lbl{ color:var(--text); }

  /* ---------- MAIN CONTENT ---------- */
  main{ flex:1; padding:8px 16px calc(120px + var(--safe-bottom)); }
  .meal-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px 6px; margin-top:10px; animation: fadeUp .25s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .meal-title{ font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--text); display:flex; align-items:center; gap:8px; }
  .meal-sub{ font-size:12px; color:var(--text-dim); margin-top:-4px; margin-bottom:10px; font-weight:600; }

  .section{ margin:14px 0; }
  .section-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .section-label{ font-size:13px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:0.03em; }
  .section-qty{ font-family:'Bebas Neue',sans-serif; font-size:17px; color:var(--accent); }
  .option-list{ display:flex; flex-direction:column; gap:6px; }
  .option{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:11px; padding:9px 12px; font-size:13.5px; font-weight:500; }
  .option .bullet{ width:7px; height:7px; border-radius:50%; background:var(--accent2); flex:0 0 auto; }
  .option-note{ font-size:11.5px; color:var(--text-dim); margin-top:6px; padding-left:2px; font-weight:600; }

  .part{ margin:12px 0; }
  .part-title{ font-size:12.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:7px; }

  .notes{ border-top:1px dashed var(--border); margin-top:14px; padding:12px 0 14px; display:flex; flex-direction:column; gap:5px; }
  .note-line{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
  .note-line b{ color:var(--accent2); }

  .simple-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .simple-item{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:11px; padding:10px 12px; font-size:13.5px; font-weight:500; }
  .simple-item .bullet{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex:0 0 auto; }

  /* ---------- BOTTOM BAR ---------- */
  .bottom-bar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; pointer-events:none; }
  .bottom-inner{ pointer-events:auto; width:100%; max-width:480px; padding:10px 16px calc(14px + var(--safe-bottom)); background:linear-gradient(180deg, transparent, var(--bg) 30%); }
  .validate-btn{ width:100%; border:none; border-radius:16px; padding:16px; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition: all .15s ease; background:var(--accent); color:#1A0D08; box-shadow:0 8px 24px rgba(255,90,54,0.25); }
  .validate-btn.done{ background:var(--surface-2); color:var(--success); box-shadow:none; border:1px solid var(--border); }
  .validate-btn:active{ transform:scale(0.98); }
  .validate-btn .next-icon{ font-size:17px; }

  /* ---------- DAY COMPLETE OVERLAY ---------- */
  .celebrate{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(15,16,19,0.82); backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .celebrate-card{ text-align:center; padding:30px; }
  .celebrate-card .big{ font-family:'Bebas Neue',sans-serif; font-size:48px; color:var(--success); }
  .celebrate-card .small{ font-size:13px; color:var(--text-dim); margin-top:6px; font-weight:600; }

  /* ---------- MOBILITY TAB ---------- */
  .mobility-header{ padding:6px 16px 4px; }
  .mobility-header h2{ font-family:'Bebas Neue',sans-serif; font-size:28px; margin:6px 0 2px; }
  .mobility-header p{ font-size:12.5px; color:var(--text-dim); font-weight:600; line-height:1.5; margin:0 0 6px; }
  .mob-list{ padding:6px 16px calc(40px + var(--safe-bottom)); display:flex; flex-direction:column; gap:10px; }
  .mob-item{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; display:flex; gap:12px; }
  .mob-num{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-family:'Bebas Neue',sans-serif; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .mob-body .mob-name{ font-weight:800; font-size:14px; margin-bottom:2px; }
  .mob-body .mob-dur{ font-size:11px; color:var(--accent2); font-weight:700; margin-bottom:5px; }
  .mob-body .mob-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.5; font-weight:500; }

  .confirm-reset{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(15,16,19,0.85); padding:24px; }
  .confirm-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; max-width:320px; text-align:center; }
  .confirm-card p{ font-size:13.5px; color:var(--text-dim); font-weight:600; margin:0 0 14px; }
  .confirm-actions{ display:flex; gap:8px; }
  .confirm-actions button{ flex:1; padding:10px; border-radius:12px; border:none; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .confirm-actions .cancel{ background:var(--surface-2); color:var(--text); }
  .confirm-actions .yes{ background:var(--accent); color:#1A0D08; }

  /* ---------- TRAINING TAB ---------- */
  .training-header{ padding:6px 16px 4px; }
  .training-header h2{ font-family:'Bebas Neue',sans-serif; font-size:28px; margin:6px 0 2px; }
  .training-header p{ font-size:12.5px; color:var(--text-dim); font-weight:600; line-height:1.5; margin:0 0 10px; }
  .training-tools{ display:flex; gap:8px; align-items:center; margin:10px 0; }
  .training-select{ flex:1; min-width:0; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:11px 12px; font:700 12.5px Inter,sans-serif; outline:none; }
  .small-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:12px; padding:10px 12px; font:800 12px Inter,sans-serif; cursor:pointer; white-space:nowrap; }
  .small-btn.primary{ background:var(--accent); color:#1A0D08; border-color:var(--accent); }
  .program-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin:8px 16px; }
  .program-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .program-title{ font-family:'Bebas Neue',sans-serif; font-size:22px; }
  .program-actions{ display:flex; gap:5px; }
  .icon-btn{ width:32px; height:32px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); border-radius:9px; cursor:pointer; font-weight:800; }
  .exercise-card{ background:var(--surface-2); border-radius:13px; padding:11px; margin-top:8px; }
  .exercise-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .exercise-name{ font-size:13.5px; font-weight:800; }
  .exercise-actions{ display:flex; gap:4px; }
  .set-list{ display:flex; flex-direction:column; gap:5px; margin-top:8px; }
  .set-row{ display:grid; grid-template-columns:34px 1fr 1fr auto; gap:6px; align-items:center; }
  .set-no{ font-family:'Bebas Neue',sans-serif; color:var(--accent); font-size:17px; text-align:center; }
  .set-input{ width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:8px 7px; font:600 12px Inter,sans-serif; outline:none; }
  .set-input:focus{ border-color:var(--accent); }
  .remove-set{ width:30px; height:30px; border:0; background:transparent; color:var(--text-faint); cursor:pointer; font-size:17px; }
  .add-set{ margin-top:7px; border:1px dashed var(--border); background:transparent; color:var(--text-dim); border-radius:9px; padding:7px 10px; width:100%; font:700 11px Inter,sans-serif; cursor:pointer; }
  .add-exercise{ width:100%; margin-top:10px; border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:11px; padding:10px; font:800 12px Inter,sans-serif; cursor:pointer; }
  .bank{ margin:10px 16px 100px; }
  .bank-title{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px; }
  .bank-title h3{ font-family:'Bebas Neue',sans-serif; font-size:20px; margin:0; }
  .bank-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .bank-chip{ border:1px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:20px; padding:7px 10px; font:700 11px Inter,sans-serif; cursor:pointer; }
  .bank-chip:active{ transform:scale(.98); }
  .program-chips{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; flex:1; }
  .program-chips::-webkit-scrollbar{display:none;}
  .program-chip{ border:1px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:11px; padding:9px 12px; font:800 11.5px Inter,sans-serif; cursor:pointer; white-space:nowrap; }
  .program-chip.active{ background:var(--accent); border-color:var(--accent); color:#1A0D08; }
  .bank-modal{ position:fixed; inset:0; z-index:80; background:rgba(15,16,19,.84); backdrop-filter:blur(5px); display:flex; align-items:flex-end; justify-content:center; padding:0; }
  .bank-modal-card{ width:100%; max-width:480px; max-height:88vh; overflow:auto; background:var(--bg); border:1px solid var(--border); border-radius:22px 22px 0 0; padding:18px 16px calc(22px + var(--safe-bottom)); box-shadow:0 -18px 50px rgba(0,0,0,.35); }
  .bank-modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .bank-modal-head h3{ font-family:'Bebas Neue',sans-serif; font-size:27px; margin:0; }
  .bank-close{ width:34px; height:34px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:10px; cursor:pointer; font-size:18px; }
  .bank-group{ margin:14px 0; }
  .bank-group-title{ font-size:11px; font-weight:800; color:var(--accent2); text-transform:uppercase; letter-spacing:.06em; margin:0 0 7px; }
  .bank-modal-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .bank-modal-list .bank-chip.selected{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .empty-training{ text-align:center; color:var(--text-dim); padding:28px 18px; background:var(--surface); border:1px dashed var(--border); border-radius:16px; margin:10px 16px; font-size:12.5px; line-height:1.5; }
  .exercise-meta{ font-size:10.5px; color:var(--accent2); font-weight:700; margin-top:3px; }
  .edit-modal{ position:fixed; inset:0; z-index:90; background:rgba(15,16,19,.84); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:18px; }
  .edit-modal-card{ width:100%; max-width:430px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:0 18px 60px rgba(0,0,0,.4); }
  .edit-modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .edit-modal-head h3{ font-family:'Bebas Neue',sans-serif; font-size:27px; margin:0; }
  .form-field{ margin:10px 0; }
  .form-field label{ display:block; font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:800; margin:0 0 5px; }
  .form-control{ width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 11px; font:600 12.5px Inter,sans-serif; outline:none; }
  .form-control:focus{ border-color:var(--accent); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .edit-actions{ display:flex; gap:8px; margin-top:15px; }
  .edit-actions button{ flex:1; }

  /* ---------- SESSION MODE (série par série) ---------- */
  .session-head-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 0; }
  .session-prog-title{ font-family:'Bebas Neue',sans-serif; font-size:24px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mode-toggle-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:11px; padding:9px 12px; font:800 11.5px Inter,sans-serif; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .mode-toggle-btn.editing{ background:var(--accent); color:#1A0D08; border-color:var(--accent); }
  .reset-session-link{ display:block; text-align:center; margin:6px auto 0; background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:700; padding:6px; cursor:pointer; }

  .set-card-wrap{ position:relative; }
  .set-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 18px 20px; margin-top:10px; text-align:center; animation: fadeUp .25s ease; }
  .set-card.valid-flash{ border-color:var(--success); }
  .set-exo-name{ font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--text); }
  .set-exo-sub{ font-size:11.5px; color:var(--text-dim); font-weight:700; margin-top:2px; letter-spacing:0.02em; }
  .target-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin:22px 0 6px; }
  .target-block{ text-align:center; min-width:76px; }
  .target-num{ font-family:'Bebas Neue',sans-serif; font-size:58px; line-height:1; }
  .target-num.reps{ color:var(--accent2); }
  .target-num.weight{ color:var(--accent); }
  .target-lbl{ font-size:10px; color:var(--text-dim); font-weight:800; letter-spacing:0.08em; text-transform:uppercase; margin-top:4px; }
  .target-x{ font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--text-faint); margin-top:-14px; }

  .set-burst{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:6; }
  .set-burst .check{ width:78px; height:78px; border-radius:50%; background:var(--success); color:#0B1F13; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:800; animation: burstIn .5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 0 0 12px rgba(62,217,139,0.16); }
  @keyframes burstIn{ 0%{ transform:scale(0.15); opacity:0; } 55%{ transform:scale(1.18); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  .validate-btn.success-flash{ background:var(--success); color:#0B1F13; box-shadow:0 8px 24px rgba(62,217,139,0.3); animation: flashScale .35s ease; }
  @keyframes flashScale{ 0%{ transform:scale(1); } 40%{ transform:scale(1.04); } 100%{ transform:scale(1); } }

  .empty-session{ text-align:center; color:var(--text-dim); padding:30px 20px; background:var(--surface); border:1px dashed var(--border); border-radius:16px; margin:14px 16px; font-size:12.5px; line-height:1.6; }
  .empty-session button{ margin-top:12px; }

  .session-celebrate .big{ font-size:38px; }
</style>
</head>
<body>
<div id="app"></div>

<script>

function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(d){ return pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)+"/"+d.getUTCFullYear(); }

const BUILD_END = Date.UTC(2026,8,20);
const PEAK_END = Date.UTC(2026,8,27);

function phaseFor(t){
  if(t<=BASE_END) return "Base";
  if(t<=BUILD_END) return "Build";
  if(t<=PEAK_END) return "Peak";
  return "Course";
}
function carbBonus(phase,effort){ return (effort==="Intense" && (phase==="Build"||phase==="Peak")) ? 15 : 0; }

function sectionsMeal(title, protLabel, protQty, protOpts, carbLabel, carbQty, carbOpts, extraNote){

    {label:protLabel, qty:protQty, unit:"g", options:protOpts},
    {label:carbLabel, qty:carbQty, unit:"g", options:carbOpts},
  ], notes };
}
function listMeal(title, items){ return { type:"list", title, items }; }
function partsMeal(title, parts){ return { type:"parts", title, parts }; }

function flattenBank(){ return EXERCISE_BANK_DEFAULT.flatMap(g=>g.exercises); }
function normalizeBank(bank){
  const groups = EXERCISE_BANK_DEFAULT.map(g=>({group:g.group, exercises:g.exercises.slice()}));
  (bank||[]).forEach(item=>{
    if(typeof item === "object" && item.name){
      let g=groups.find(x=>x.group===item.group)||groups[groups.length-1]; if(!g.exercises.includes(item.name)) g.exercises.push(item.name);
    } else if(typeof item === "string" && !groups.some(g=>g.exercises.includes(item))){ groups[1].exercises.push(item); }
  });
  return groups;
}


function exerciseConfig(ex){
  const type = ex.metricType || (ex.type === "time" ? "time" : ex.type === "distance" ? "distance" : "reps");
  const unit = ex.metricUnit || (type === "time" ? "min" : type === "distance" ? "m" : "reps");
  const loadUnit = ex.loadUnit || "kg";
  return Object.assign(ex, {metricType:type, metricUnit:unit, loadUnit});
}
function metricTypeLabel(type){ return ({reps:"Répétitions",time:"Temps",distance:"Distance",calories:"Calories",quantity:"Quantité"}[type] || "Répétitions"); }
function metricUnits(type){
  return ({
    reps:["reps"], time:["sec","min","h"], distance:["m","km","mi"], calories:["kcal"], quantity:["unités","reps"]
  }[type] || ["reps"]);
}

  };
}

function todayRealIdx(){
  const now = new Date();
  const t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  let idx = DAYS.findIndex(d => Date.UTC(d.date.getUTCFullYear(), d.date.getUTCMonth(), d.date.getUTCDate()) === t);
  if(idx>=0) return idx;
  if(t < START) return 0;
  return DAYS.length-1;
}

async function loadState(){
  try{
    let raw = null;
    if(window.storage){
      const r = await window.storage.get("hyrox_progress");
      raw = r && r.value ? r.value : null;
    } else {
      raw = localStorage.getItem("hyrox_progress");
    }
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      if(!state.workout || !state.workout.programs) state.workout = makeWorkoutDefaults();
      state.workout.bank = normalizeBank(state.workout.bank);
      if(!state.workout.programs.length) state.workout.programs = makeWorkoutDefaults().programs;
      if(!state.workout.activeProgramId) state.workout.activeProgramId = state.workout.programs[0].id;
      if(!state.workout.session) state.workout.session = {};
      state.workout.programs.forEach(p=>p.exercises.forEach(ex=>exerciseConfig(ex)));
    } else {
      state.dayIdx = todayRealIdx();
    }
  }catch(e){
    state.dayIdx = todayRealIdx();
    state.workout = makeWorkoutDefaults();
  }
  state.loaded = true;
  render();
}
async function persist(){
  const payload = JSON.stringify({
    dayIdx:state.dayIdx, mealIdx:state.mealIdx, validated:state.validated, workout:state.workout
  });
  try{
    if(window.storage) await window.storage.set("hyrox_progress", payload);
    else localStorage.setItem("hyrox_progress", payload);
  }catch(e){ try{ localStorage.setItem("hyrox_progress", payload); }catch(_){} }
}

/* ===================== HELPERS UI ===================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function phaseTagClass(phase){ return "phase-" + (phase==="JOUR J" ? "JOURJ" : phase); }
function setMetricValue(set, ex){ return set.value ?? set.reps ?? ""; }
function setLoadValue(set){ return set.load ?? set.weight ?? ""; }
function metricPlaceholder(ex){ return ex.metricType==="reps" ? "Répétitions" : metricTypeLabel(ex.metricType); }
function loadPlaceholder(ex){ return ex.metricType==="reps" ? `Charge (${ex.loadUnit})` : `Charge (${ex.loadUnit})`; }
function totalMeals(){ return DAYS.length * 4; }
function validatedCount(){ return Object.keys(state.validated).length; }

function sessionFor(program){
  if(!state.workout.session) state.workout.session = {};
  let s = state.workout.session[program.id];
  const firstExId = program.exercises.length ? program.exercises[0].id : null;
  if(!s){ s = { exId:firstExId, setIdx:0, validated:{} }; state.workout.session[program.id] = s; }
  if(!program.exercises.some(e=>e.id===s.exId)){ s.exId = firstExId; s.setIdx = 0; }
  return s;
}

function renderSectionsMeal(meal){
  let html = `<div class="meal-title">${MEAL_ICONS[state.mealIdx]} ${esc(meal.title)}</div>`;
  meal.sections.forEach(sec=>{
    html += `<div class="section">
      <div class="section-head"><span class="section-label">${esc(sec.label)}</span><span class="section-qty">${sec.qty}${sec.unit}</span></div>
      <div class="option-list">`;
    sec.options.forEach(o=> html += `<div class="option"><span class="bullet"></span>${esc(o)}</div>`);
    html += `</div></div>`;
  });
  if(meal.notes && meal.notes.length){
    html += `<div class="notes">`;
    meal.notes.forEach(n=> html += `<div class="note-line"><b>+</b> ${esc(n)}</div>`);
    html += `</div>`;
  }
  return html;
}
function renderPartsMeal(meal){
  let html = `<div class="meal-title">${MEAL_ICONS[state.mealIdx]} ${esc(meal.title)}</div>`;
  meal.parts.forEach(p=>{
    html += `<div class="part"><div class="part-title">${esc(p.title)}</div>`;
    if(p.options && p.options.length){
      html += `<div class="option-list">`;
      p.options.forEach(o=> html += `<div class="option"><span class="bullet"></span>${esc(o)}</div>`);
      html += `</div>`;
    }
    if(p.note) html += `<div class="option-note">+ ${esc(p.note)}</div>`;
    html += `</div>`;
  });
  html += `<div style="height:6px"></div>`;
  return html;
}
function renderListMeal(meal){
  let html = `<div class="meal-title">${MEAL_ICONS[state.mealIdx]} ${esc(meal.title)}</div>`;
  html += `<div class="simple-list">`;
  meal.items.forEach(it=> html += `<div class="simple-item"><span class="bullet"></span>${esc(it)}</div>`);
  html += `</div>`;
  return html;
}
function renderMealBody(meal){
  if(meal.type==="sections") return renderSectionsMeal(meal);
  if(meal.type==="parts") return renderPartsMeal(meal);
  return renderListMeal(meal);
}

    </div>`;

    if(program){
      html += `<div class="session-head-row">
        <div class="session-prog-title">${esc(program.name)}</div>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn" data-act="rename-program" title="Renommer">✎</button>
          <button class="icon-btn" data-act="delete-program" title="Supprimer">×</button>
          <button class="mode-toggle-btn ${state.trainingMode==='edit'?'editing':''}" data-act="toggle-training-mode">${state.trainingMode==='edit' ? '✓ Terminer' : '✎ Modifier'}</button>
        </div>
      </div>`;

      if(state.trainingMode === "edit"){
        /* ---------- MODE ÉDITION (liste complète, existant) ---------- */
        html += `<div class="program-card" style="margin-top:10px;">`;
        if(!program.exercises.length){
          html += `<div class="empty-training">Aucun exercice dans ce programme.<br>Appuie sur « Ajouter un exercice » pour ouvrir la banque.</div>`;
        } else {
          program.exercises.forEach((ex,ei)=>{
            exerciseConfig(ex);
            html += `<div class="exercise-card">
              <div class="exercise-head">
                <div><div class="exercise-name">${esc(ex.name)}</div><div class="exercise-meta">${esc(metricTypeLabel(ex.metricType))} · ${esc(ex.metricUnit)} · charge ${esc(ex.loadUnit)}</div></div>
                <div class="exercise-actions">
                  <button class="icon-btn" data-act="edit-exercise" data-eidx="${ei}" title="Modifier">✎</button>
                  <button class="icon-btn" data-act="delete-exercise" data-eidx="${ei}" title="Supprimer">×</button>
                </div>
              </div>
              <div class="set-list">`;
            ex.sets.forEach((set,si)=>{
              html += `<div class="set-row">
                <div class="set-no">${si+1}</div>
                <input class="set-input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="${esc(metricPlaceholder(ex))} (${esc(ex.metricUnit)})" value="${setMetricValue(set,ex)}" data-act="set-metric" data-eidx="${ei}" data-sidx="${si}">
                <input class="set-input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="${esc(loadPlaceholder(ex))}" value="${setLoadValue(set)}" data-act="set-load" data-eidx="${ei}" data-sidx="${si}">
                <button class="remove-set" data-act="remove-set" data-eidx="${ei}" data-sidx="${si}" title="Supprimer la série">×</button>
              </div>`;
            });
            html += `</div><button class="add-set" data-act="add-set" data-eidx="${ei}">+ Ajouter une série</button></div>`;
          });
        }
        html += `<button class="add-exercise" data-act="add-exercise">+ Ajouter un exercice au programme</button></div>`;

      } else if(!program.exercises.length){
        /* ---------- MODE SESSION, programme vide ---------- */
        html += `<div class="empty-session">Ce programme n'a pas encore d'exercice.<br>Passe en mode édition pour en ajouter.
          <br><button class="small-btn primary" data-act="toggle-training-mode">✎ Modifier le programme</button></div>`;

      } else {
        /* ---------- MODE SESSION (série par série) ---------- */
        const sess = sessionFor(program);
        const exIdx = program.exercises.findIndex(e=>e.id===sess.exId);
        const ex = program.exercises[exIdx];
        exerciseConfig(ex);
        if(sess.setIdx >= ex.sets.length) sess.setIdx = ex.sets.length-1;
        const set = ex.sets[sess.setIdx];
        const setKey = ex.id+"_"+sess.setIdx;
        const setDone = !!sess.validated[setKey];

        html += `
        <div class="day-nav">
          <button data-act="prev-exercise" ${exIdx===0?'disabled':''}>‹</button>
          <div class="day-info">
            <div class="jour">${esc(ex.name)}</div>
            <div class="date">Exercice ${exIdx+1}/${program.exercises.length}</div>
          </div>
          <button data-act="next-exercise" ${exIdx===program.exercises.length-1?'disabled':''}>›</button>
        </div>

        <div class="dots">`;
        ex.sets.forEach((s,si)=>{
          const done = !!sess.validated[ex.id+"_"+si];
          const cur = si===sess.setIdx;
          html += `<button class="dot ${cur?'current':''} ${done?'done':''}" data-act="goto-set" data-idx="${si}">
            <div class="circle">${done ? '✓' : si+1}</div>
            <div class="lbl">Série ${si+1}</div>
          </button>`;
        });
        html += `</div>
        <button class="reset-session-link" data-act="reset-session">↺ Réinitialiser le suivi de cette séance</button>

        <main><div class="set-card-wrap">
          <div class="set-card ${setDone?'valid-flash':''}">
            <div class="set-exo-name">${esc(ex.name)}</div>
            <div class="set-exo-sub">Série ${sess.setIdx+1} / ${ex.sets.length}</div>
            <div class="target-row">
              <div class="target-block">
                <div class="target-num reps">${esc(setMetricValue(set,ex) || "—")}</div>
                <div class="target-lbl">${esc(metricPlaceholder(ex))}</div>
              </div>
              <div class="target-x">×</div>
              <div class="target-block">
                <div class="target-num weight">${esc(setLoadValue(set) || "—")}</div>
                <div class="target-lbl">${esc(ex.loadUnit)}</div>
              </div>
            </div>
          </div>
          ${justValidatedSet ? `<div class="set-burst"><div class="check">✓</div></div>` : ``}
        </div></main>

        <div class="bottom-bar"><div class="bottom-inner">
          <button class="validate-btn ${setDone?'done':''} ${justValidatedSet?'success-flash':''}" data-act="validate-set">
            ${setDone ? '<span>✓ Série validée</span>' : '<span>Valider la série</span><span class="next-icon">→</span>'}
          </button>
        </div></div>`;
      }
    }

  } else if(state.view === "meals") {
    html += `
    <div class="day-nav">
      <button data-act="prev-day" ${state.dayIdx===0?'disabled':''}>‹</button>
      <div class="day-info">
        <div class="jour">${day.jour}</div>
        <div class="date">${fmtDate(day.date)}</div>
      </div>
      <button data-act="next-day" ${state.dayIdx===DAYS.length-1?'disabled':''}>›</button>
    </div>
    <div class="chips-row">
      <span class="tag ${phaseTagClass(day.phase)}">${day.phase==='JOUR J' ? 'JOUR J' : day.phase}</span>
      <span class="tag effort">${esc(day.effort)}</span>
    </div>
    <div class="chips-row"><span class="tag seance">${esc(day.seance)}</span></div>
    ${!isToday ? `<button class="goto-today" data-act="goto-today">↳ Aller à aujourd'hui</button>` : ``}

    <div class="dots">`;
    MEAL_KEYS.forEach((key,i)=>{
      const done = !!state.validated[day.iso+"_"+i];
      const cur = i===state.mealIdx;
      html += `<button class="dot ${cur?'current':''} ${done?'done':''}" data-act="goto-meal" data-idx="${i}">
        <div class="circle">${done ? '✓' : MEAL_ICONS[i]}</div>
        <div class="lbl">${MEAL_LABELS_DEFAULT[i]}</div>
      </button>`;
    });
    html += `</div>`;

    const mealKey = MEAL_KEYS[state.mealIdx];
    const meal = day.meals[mealKey];
    const mealDone = !!state.validated[day.iso+"_"+state.mealIdx];

    html += `<main><div class="meal-card">${renderMealBody(meal)}</div></main>`;

    html += `<div class="bottom-bar"><div class="bottom-inner">
      <button class="validate-btn ${mealDone?'done':''}" data-act="validate">
        ${mealDone ? '<span>✓ Repas validé</span>' : '<span>Valider ce repas</span><span class="next-icon">→</span>'}
      </button>
    </div></div>`;
  }

  if(celebrating){
    html += `<div class="celebrate"><div class="celebrate-card">
      <div class="big">JOUR VALIDÉ ✓</div>
      <div class="small">On enchaîne sur la suite du plan</div>
    </div></div>`;
  }
  if(trainingCelebrate){
    html += `<div class="celebrate"><div class="celebrate-card session-celebrate">
      <div class="big">SÉANCE VALIDÉE 💪</div>
      <div class="small">Toutes les séries sont faites — beau travail</div>
    </div></div>`;
  }
  if(resetConfirm){
    html += `<div class="confirm-reset"><div class="confirm-card">
      <p>Réinitialiser toute la progression (repas + entraînements) ?</p>
      <div class="confirm-actions"><button class="cancel" data-act="cancel-reset">Annuler</button><button class="yes" data-act="do-reset">Réinitialiser</button></div>
    </div></div>`;
  }

  /* Banque d'exercices : affichée uniquement après un clic sur « Ajouter un exercice ». */
  if(state.workoutBankOpen){
    const bank = state.workout.bank || [];
    html += `<div class="bank-modal" data-act="close-bank">
      <div class="bank-modal-card" data-bank-card>
        <div class="bank-modal-head">
          <div>
            <h3>Choisir un exercice</h3>
            <div style="font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:2px;">Sélectionne un exercice pour l'ajouter à ${esc((state.workout.programs.find(p=>p.id===state.workout.activeProgramId)||{}).name || 'la séance')}</div>
          </div>
          <button class="bank-close" data-act="close-bank" aria-label="Fermer">×</button>
        </div>
        <button class="small-btn primary" style="width:100%;margin-bottom:10px;" data-act="add-bank-exercise">+ Créer un exercice personnalisé</button>
        ${bank.map(g=>`<div class="bank-group">
          <div class="bank-group-title">${esc(g.group)}</div>
          <div class="bank-modal-list">
            ${g.exercises.map(name=>`<button class="bank-chip" data-act="bank-add" data-name="${esc(name)}">${esc(name)}</button>`).join('')}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  if(state.exerciseEditOpen){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const ex=p && p.exercises[state.editExerciseIndex];
    if(ex){
      exerciseConfig(ex);
      const units=metricUnits(ex.metricType);
      html += `<div class="edit-modal" data-edit-overlay>
        <div class="edit-modal-card" data-edit-card>
          <div class="edit-modal-head"><h3>Modifier l'exercice</h3><button class="bank-close" data-act="close-exercise-edit">×</button></div>
          <div class="form-field"><label>Nom de l'exercice</label><input id="edit-ex-name" class="form-control" value="${esc(ex.name)}"></div>
          <div class="form-grid">
            <div class="form-field"><label>Type de mesure</label><select id="edit-ex-type" class="form-control">${["reps","time","distance","calories","quantity"].map(t=>`<option value="${t}" ${ex.metricType===t?'selected':''}>${metricTypeLabel(t)}</option>`).join('')}</select></div>
            <div class="form-field"><label>Unité</label><select id="edit-ex-unit" class="form-control">${units.map(u=>`<option value="${u}" ${ex.metricUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          </div>
          <div class="form-field"><label>Unité de charge (optionnelle)</label><select id="edit-ex-load-unit" class="form-control">${["kg","lb","sans charge"].map(u=>`<option value="${u}" ${ex.loadUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div class="edit-actions"><button class="small-btn" data-act="close-exercise-edit">Annuler</button><button class="small-btn primary" data-act="save-exercise-edit">Enregistrer</button></div>
        </div>
      </div>`;
    }
  }

  app.innerHTML = html;
}

/* ===================== ACTIONS ===================== */
document.addEventListener("change", function(e){
  const el=e.target;
  const act=el.getAttribute("data-act");
  if(!act) return;
  if(el.id==="edit-ex-type") {
    const unit=document.getElementById("edit-ex-unit");
    if(unit){ unit.innerHTML=metricUnits(el.value).map(u=>`<option value="${u}">${u}</option>`).join(""); }
    return;
  }
  if(act==="set-metric" || act==="set-load") {
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const ei=+el.dataset.eidx, si=+el.dataset.sidx;
    if(p && p.exercises[ei] && p.exercises[ei].sets[si]){
      const set=p.exercises[ei].sets[si];
      if(act==="set-metric"){ set.value=el.value; if(p.exercises[ei].metricType==="reps") set.reps=el.value; }
      else { set.load=el.value; set.weight=el.value; }
      persist();
    }
  }
});

document.addEventListener("click", function(e){
  /* Fermer la banque en cliquant sur le fond, mais pas lorsque l'on clique dans la liste. */
  if(state.workoutBankOpen && e.target.classList.contains("bank-modal")){
    state.workoutBankOpen=false; render(); return;
  }
  if(state.exerciseEditOpen && e.target.classList.contains("edit-modal")){
    state.exerciseEditOpen=false; state.editExerciseIndex=null; render(); return;
  }
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const act = btn.getAttribute("data-act");

  if(act==="view-meals"){ state.view="meals"; render(); }
  else if(act==="view-training"){ state.view="training"; render(); }
  else if(act==="select-program"){
    state.workout.activeProgramId = btn.dataset.pid; state.trainingMode="session"; persist(); render();
  }
  else if(act==="add-program"){
    const name = prompt("Nom du programme (ex. Jambes, Haut du corps, Hyrox…)","Nouveau programme");
    if(name && name.trim()){
      const id = "p"+Date.now();
      state.workout.programs.push({id,name:name.trim(),exercises:[]});
      state.workout.activeProgramId=id; state.trainingMode="edit"; persist(); render();
    }
  }
  else if(act==="rename-program"){
    const p = state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    if(p){
      const name=prompt("Nom du programme",p.name);
      if(name && name.trim()){ p.name=name.trim(); persist(); render(); }
    }
  }
  else if(act==="delete-program"){
    if(state.workout.programs.length<=1){ alert("Il faut conserver au moins un programme."); return; }
    const p = state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    if(p && confirm(`Supprimer « ${p.name} » ?`)){
      state.workout.programs=state.workout.programs.filter(x=>x.id!==p.id);
      state.workout.activeProgramId=state.workout.programs[0].id; persist(); render();
    }
  }
  else if(act==="add-exercise"){ state.workoutBankOpen=true; render(); }
  else if(act==="close-bank"){ state.workoutBankOpen=false; render(); }
  else if(act==="bank-add"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const name=btn.getAttribute("data-name");
    if(p && name && !p.exercises.some(x=>x.name===name)){
      p.exercises.push({id:"e"+Date.now(),name,metricType:"reps",metricUnit:"reps",loadUnit:"kg",sets:[{reps:"",weight:""}]});
      state.workoutBankOpen=false; persist(); render();
    } else if(p && name){ alert("Cet exercice est déjà présent dans la séance."); }
  }
  else if(act==="add-bank-exercise"){
    const name=prompt("Nom du nouvel exercice","Mon exercice");
    const group=prompt("Groupe musculaire (ex. Dos, Jambes, Core, Hyrox / Fonctionnel)","Hyrox / Fonctionnel");
    if(name && name.trim()){
      const groups=state.workout.bank; let g=groups.find(x=>x.group.toLowerCase()===String(group||"").trim().toLowerCase());
      if(!g){ g={group:(group&&group.trim())||"Personnalisé",exercises:[]}; groups.push(g); }
      if(!g.exercises.includes(name.trim())) g.exercises.push(name.trim());
      state.workoutBankOpen=true; persist(); render();
    }
  }
  else if(act==="edit-exercise"){
    state.editExerciseIndex=+btn.dataset.eidx; state.exerciseEditOpen=true; render();
  }
  else if(act==="close-exercise-edit"){ state.exerciseEditOpen=false; state.editExerciseIndex=null; render(); }
  else if(act==="save-exercise-edit"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const ei=state.editExerciseIndex;
    const name=document.getElementById("edit-ex-name")?.value.trim();
    const type=document.getElementById("edit-ex-type")?.value;
    const unit=document.getElementById("edit-ex-unit")?.value;
    const loadUnit=document.getElementById("edit-ex-load-unit")?.value;
    if(p && p.exercises[ei] && name){
      const ex=p.exercises[ei]; ex.name=name; ex.metricType=type; ex.metricUnit=unit; ex.loadUnit=loadUnit;
      ex.sets.forEach(set=>{ if(set.value==null && set.reps!=null) set.value=set.reps; if(set.load==null && set.weight!=null) set.load=set.weight; });
      const group=state.workout.bank.find(g=>g.exercises.includes(ex.name));
      if(!group && !state.workout.bank.some(g=>g.exercises.includes(name))) state.workout.bank[0].exercises.push(name);
      state.exerciseEditOpen=false; state.editExerciseIndex=null; persist(); render();
    } else alert("Le nom de l'exercice est obligatoire.");
  }
  else if(act==="delete-exercise"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId), ei=+btn.dataset.eidx;
    if(p && p.exercises[ei] && confirm(`Supprimer « ${p.exercises[ei].name} » ?`)){ p.exercises.splice(ei,1); persist(); render(); }
  }
  else if(act==="add-set"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId), ei=+btn.dataset.eidx;
    if(p && p.exercises[ei]){ p.exercises[ei].sets.push({reps:"",weight:""}); persist(); render(); }
  }
  else if(act==="remove-set"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId), ei=+btn.dataset.eidx, si=+btn.dataset.sidx;
    if(p && p.exercises[ei] && p.exercises[ei].sets.length>1){ p.exercises[ei].sets.splice(si,1); persist(); render(); }
  }
  else if(act==="toggle-training-mode"){
    state.trainingMode = state.trainingMode==="edit" ? "session" : "edit"; render();
  }
  else if(act==="prev-exercise"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const sess=sessionFor(p); const idx=p.exercises.findIndex(e=>e.id===sess.exId);
    if(idx>0){ sess.exId=p.exercises[idx-1].id; sess.setIdx=0; persist(); render(); }
  }
  else if(act==="next-exercise"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const sess=sessionFor(p); const idx=p.exercises.findIndex(e=>e.id===sess.exId);
    if(idx<p.exercises.length-1){ sess.exId=p.exercises[idx+1].id; sess.setIdx=0; persist(); render(); }
  }
  else if(act==="goto-set"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const sess=sessionFor(p); sess.setIdx=parseInt(btn.getAttribute("data-idx"),10); persist(); render();
  }
  else if(act==="reset-session"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    state.workout.session[p.id] = { exId: p.exercises.length?p.exercises[0].id:null, setIdx:0, validated:{} };
    persist(); render();
  }
  else if(act==="validate-set"){
    const p=state.workout.programs.find(x=>x.id===state.workout.activeProgramId);
    const sess=sessionFor(p);
    const exIdx=p.exercises.findIndex(e=>e.id===sess.exId);
    const ex=p.exercises[exIdx];
    const key=ex.id+"_"+sess.setIdx;
    if(sess.validated[key]){ delete sess.validated[key]; persist(); render(); return; }
    sess.validated[key]=true;
    persist();
    justValidatedSet = true; render();
    setTimeout(()=>{
      justValidatedSet = false;
      if(sess.setIdx < ex.sets.length-1){
        sess.setIdx += 1; persist(); render();
      } else if(exIdx < p.exercises.length-1){
        sess.exId = p.exercises[exIdx+1].id; sess.setIdx = 0; persist(); render();
      } else {
        trainingCelebrate = true; render();
        setTimeout(()=>{
          trainingCelebrate = false;
          state.workout.session[p.id] = { exId: p.exercises[0].id, setIdx:0, validated:{} };
          persist(); render();
        }, 1300);
      }
    }, 550);
  }
  else if(act==="prev-day"){ state.dayIdx = Math.max(0, state.dayIdx-1); state.mealIdx=0; render(); }
  else if(act==="next-day"){ state.dayIdx = Math.min(DAYS.length-1, state.dayIdx+1); state.mealIdx=0; render(); }
  else if(act==="goto-today"){ state.dayIdx = todayRealIdx(); state.mealIdx=0; render(); }
  else if(act==="goto-meal"){ state.mealIdx = parseInt(btn.getAttribute("data-idx"),10); render(); }
  else if(act==="ask-reset"){ resetConfirm = true; render(); }
  else if(act==="cancel-reset"){ resetConfirm = false; render(); }
  else if(act==="do-reset"){ state.validated={}; state.dayIdx=todayRealIdx(); state.mealIdx=0; state.workout=makeWorkoutDefaults(); state.trainingMode="session"; resetConfirm=false; persist(); render(); }
  else if(act==="validate"){
    const day = DAYS[state.dayIdx];
    const key = day.iso+"_"+state.mealIdx;
    if(state.validated[key]){ delete state.validated[key]; persist(); render(); return; }
    state.validated[key] = true;
    persist();
    if(state.mealIdx < 3){
      setTimeout(()=>{ state.mealIdx += 1; render(); }, 320);
      render();
    } else {
      if(state.dayIdx < DAYS.length-1){
        celebrating = true; render();
        setTimeout(()=>{
          celebrating = false;
          state.dayIdx += 1; state.mealIdx = 0;
          persist(); render();
        }, 1100);
      } else {
        celebrating = true; render();
      }
    }
  }
});

loadState();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
